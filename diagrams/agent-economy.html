<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masar — How the agent economy works</title>
<meta name="description" content="A simple animated story: Sara learns to build an AI agent on Masar, Masar checks it, businesses subscribe to use it, and Sara earns monthly revenue while keeping ownership.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;
  --bg:#08090B;--bg-2:#0D1013;--bg-3:#12161A;--fg:#F5F5F0;--muted:#858A93;--dim:#737A84;
  --mint:#66F6D2;--violet:#7C8CFF;--gold:#E8B15C;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.16);
  --display:"Archivo",-apple-system,"Segoe UI",sans-serif;--body:"Inter",-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,3vw,32px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.95rem;display:flex;align-items:center;gap:10px}
.brand i{display:inline-flex;gap:2.5px}.brand i b{width:4px;height:4px;border-radius:50%;background:var(--dim)}
.brand i b:nth-child(2){background:var(--mint)}.brand i b:nth-child(3){background:var(--violet)}
.label{font-family:var(--mono);font-size:.656rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.flag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.625rem;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(232,177,92,.38);background:rgba(232,177,92,.08);border-radius:5px;padding:4px 9px}
.flag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
main{flex:1;display:grid;grid-template-rows:auto 1fr auto;min-height:0;padding:0 clamp(12px,2.5vw,28px)}
.caption{text-align:center;padding:22px 4px 4px;min-height:112px}
.caption .k{font-family:var(--mono);font-size:.688rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mint)}
.caption h1{margin:8px auto 0;max-width:30ch;font:700 clamp(1.4rem,3.2vw,2.4rem)/1.08 var(--display);letter-spacing:-.03em;transition:opacity .35s}
.caption h1.swap{opacity:0}
.stage{position:relative;min-height:0}
svg{width:100%;height:100%;display:block}
.g{transition:opacity .6s var(--ease)}
.g.hide{opacity:0}
.dim{opacity:.28;transition:opacity .6s var(--ease)}
.col-t{fill:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:2.4px;text-transform:uppercase;text-anchor:middle}
.col-t.hi{fill:var(--mint)}
.col-t.gold{fill:var(--gold)}
.av{fill:var(--bg-2);stroke:var(--line-2);stroke-width:1.5}
.av.mint{stroke:var(--mint)}
.av.gold{stroke:var(--gold)}
.head{fill:var(--fg)}.body{fill:var(--fg)}
.name{fill:var(--fg);font-family:var(--body);font-weight:600;font-size:16px;text-anchor:middle}
.role{fill:var(--dim);font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;text-anchor:middle;transition:fill .5s}
.role.mint{fill:var(--mint)}.role.gold{fill:var(--gold)}
.ring{fill:none;stroke:rgba(102,246,210,.18);stroke-width:5}
.ring-f{fill:none;stroke:var(--mint);stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transform-box:fill-box}
.card{fill:var(--bg-2);stroke:rgba(102,246,210,.45);stroke-width:1.5;rx:14}
.card-t{fill:var(--fg);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.3px;text-anchor:middle}
.card-s{fill:var(--mint);font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;text-anchor:middle}
.card-o{fill:var(--muted);font-family:var(--mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;text-anchor:middle}
.bot{fill:none;stroke:var(--mint);stroke-width:2}
.bot-eye{fill:var(--mint)}
.gate{fill:none;stroke:rgba(102,246,210,.5);stroke-width:1.6;stroke-dasharray:6 6;rx:20}
.gate-t{fill:var(--mint);font-family:var(--mono);font-size:10px;letter-spacing:2.2px;text-transform:uppercase;text-anchor:middle}
.chk{fill:var(--bg-2);stroke:var(--line-2);rx:7;transition:stroke .4s,fill .4s}
.chk.on{stroke:var(--mint);fill:rgba(102,246,210,.1)}
.chk-t{fill:var(--dim);font-family:var(--body);font-weight:600;font-size:12px;text-anchor:middle;transition:fill .4s}
.chk-t.on{fill:var(--fg)}
.chk-i{fill:var(--dim);font-family:var(--mono);font-size:11px;text-anchor:middle;transition:fill .4s}
.chk-i.on{fill:var(--mint)}
.ver{fill:rgba(102,246,210,.1);stroke:var(--mint);rx:6}
.ver-t{fill:var(--mint);font-family:var(--mono);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;text-anchor:middle}
.shelf{fill:none;stroke:var(--line-2);stroke-width:1.2}
.shelf-t{fill:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;text-anchor:middle}
.biz{fill:var(--bg-2);stroke:var(--violet);stroke-width:1.5;rx:10}
.biz-i{fill:none;stroke:#B7C0FF;stroke-width:1.6}
.biz-t{fill:var(--fg);font-family:var(--body);font-weight:600;font-size:13px;text-anchor:middle}
.biz-s{fill:#B7C0FF;font-family:var(--mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;text-anchor:middle}
.path{fill:none;stroke:var(--line-2);stroke-width:1.2;stroke-dasharray:3 6;opacity:0;transition:opacity .6s}
.path.on{opacity:1}
.coin{fill:var(--gold)}.coin-g{fill:rgba(232,177,92,.25)}
.use{fill:var(--violet)}.use-g{fill:rgba(124,140,255,.25)}
.mint-p{fill:var(--mint)}.mint-p-g{fill:rgba(102,246,210,.25)}
.money{fill:var(--bg-2);stroke:rgba(232,177,92,.5);stroke-width:1.2;rx:12}
.money-k{fill:var(--gold);font-family:var(--mono);font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;text-anchor:middle}
.money-v{fill:var(--fg);font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.8px;text-anchor:middle}
.money-s{fill:var(--muted);font-family:var(--body);font-size:11px;text-anchor:middle}
.own{fill:rgba(102,246,210,.08);stroke:rgba(102,246,210,.45);rx:6}
.own-t{fill:var(--mint);font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;text-anchor:middle}
.tagline{fill:var(--muted);font-family:var(--body);font-size:13px;text-anchor:middle}
.tagline.gold{fill:var(--gold)}.tagline.mint{fill:var(--mint)}.tagline.violet{fill:#B7C0FF}
footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:12px 4px 16px;border-top:1px solid var(--line)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{background:none;border:1px solid var(--line);border-radius:7px;color:var(--dim);font-family:var(--mono);font-size:.625rem;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;cursor:pointer;transition:.25s;display:inline-flex;gap:8px;align-items:center}
.step b{font-weight:500;color:var(--muted)}
.step:hover{color:var(--fg);border-color:var(--line-2)}
.step.on{color:var(--mint);border-color:rgba(102,246,210,.45);background:rgba(102,246,210,.07)}
.step.on b{color:var(--mint)}
.step.done b{color:var(--mint)}
.ctrl{display:flex;gap:8px;align-items:center}
.btn{background:rgba(255,255,255,.025);border:1px solid var(--line-2);border-radius:8px;color:var(--fg);font-family:var(--body);font-size:.813rem;font-weight:500;padding:9px 14px;cursor:pointer;transition:.25s;min-height:38px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.28)}
.btn.primary{background:var(--mint);color:#04120E;border-color:var(--mint);font-weight:600;min-width:96px;justify-content:center}
.btn.primary:hover{background:#8BFFE0}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--mint);box-shadow:0 0 10px rgba(102,246,210,.6)}
.small{font-size:.75rem;color:var(--dim)}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:4px}
@media(max-width:720px){footer{flex-direction:column;align-items:stretch}.ctrl{justify-content:space-between}.caption{min-height:0}}
/* embed mode (inside the prototype site): no header, compact chrome */
body.embed header,body.embed .small{display:none}
body.embed .caption{padding-top:16px;min-height:96px}
body.embed main{padding:0 clamp(10px,2vw,20px)}
body.embed footer{padding:10px 4px 12px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><i><b></b><b></b><b></b></i>MASAR <span class="label" style="margin-left:14px">How the agent economy works</span></div>
  <span class="flag">Illustrative story &#183; example numbers</span>
</header>
<main>
  <div class="caption"><div class="k" id="capK">Step 1 of 6</div><h1 id="capT">Sara learns to build AI agents on Masar.</h1></div>
  <div class="stage">
    <svg id="svg" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgTitle">
      <title id="svgTitle">Animated story of the Masar agent economy</title>

        <circle class="av mint" cx="0" cy="0" r="70"/>

        <g class="bot" transform="translate(-14 -36)"><rect x="0" y="6" width="28" height="22" rx="7"/><circle class="bot-eye" cx="9" cy="17" r="2.8"/><circle class="bot-eye" cx="19" cy="17" r="2.8"/><path d="M14 6V0"/><circle cx="14" cy="-1" r="1.8"/></g>
        <text class="card-t" x="0" y="14">CV Screening</text>

      </g>
      <g id="gOwn" class="g hide" transform="translate(600 366)"><rect class="own" x="-70" y="-11" width="140" height="22"/><text class="own-t" x="0" y="4">Owned by Sara</text></g>

      <!-- MASAR LEARN (step 1) -->
      <g id="gLearn" class="g hide" transform="translate(600 250)">
        <rect class="card" x="-120" y="-78" width="240" height="156"/>
        <text class="card-s" x="0" y="-50">Masar learning path</text>
        <text class="card-t" x="0" y="-26">How to build AI agents</text>
        <g id="lessons">
          <rect class="chk" x="-100" y="-8" width="200" height="22"/><text class="chk-t" x="0" y="7" style="font-size:11px">1 · How agents work</text>
          <rect class="chk" x="-100" y="20" width="200" height="22"/><text class="chk-t" x="0" y="35" style="font-size:11px">2 · Workflows and tools</text>
          <rect class="chk" x="-100" y="48" width="200" height="22"/><text class="chk-t" x="0" y="63" style="font-size:11px">3 · Build your first agent</text>
        </g>
      </g>

      <!-- INVESTOR (step 7) -->
      <g id="gInv" class="g hide" transform="translate(1080 480)">
        <circle class="av" cx="0" cy="0" r="48" style="stroke:var(--gold)"/>
        <circle class="head" cx="0" cy="-12" r="13"/>
        <path class="body" d="M-26 30 C -26 8, 26 8, 26 30 Z"/>

        <text class="role gold" x="0" y="92">Backs Sara</text>
      </g>
      <text class="tagline" id="invNote" x="700" y="560"></text>

      <!-- QUALITY GATE -->
      <g id="gGate" class="g hide">
        <rect class="gate" x="470" y="110" width="260" height="290"/>

        <g id="chk2"><rect class="chk" x="570" y="330" width="60" height="50"/><text class="chk-i" x="600" y="352">&#10003;</text><text class="chk-t" x="600" y="370">Precision</text></g>

      <!-- MARKETPLACE shelf -->

        <text class="shelf-t" x="600" y="340">Masar marketplace</text>
      </g>
      <text class="tagline" id="midNote" x="600" y="425"></text>

      <!-- BUSINESSES -->
      <g id="gKhalid" class="g hide" transform="translate(1010 250)">
        <circle class="av gold" cx="0" cy="0" r="56"/>
        <circle class="head" cx="0" cy="-14" r="15"/>
        <path class="body" d="M-30 36 C -30 10, 30 10, 30 36 Z"/>
        <text class="name" x="0" y="86">Khalid</text>
        <text class="role gold" id="khalidRole" x="0" y="106">Business owner</text>
      </g>
      <g id="gBiz2" class="g hide" transform="translate(900 120)"><circle class="av" cx="0" cy="0" r="34" style="stroke:var(--violet)"/><g class="biz-i" transform="translate(-13 -13)"><rect x="0" y="4" width="26" height="22" rx="2"/><path d="M6 10h4M16 10h4M6 16h4M16 16h4M10 26v-6h6v6"/></g><text class="biz-s" x="0" y="54">Business 2</text></g>
      <g id="gBiz3" class="g hide" transform="translate(900 390)"><circle class="av" cx="0" cy="0" r="34" style="stroke:var(--violet)"/><g class="biz-i" transform="translate(-13 -13)"><rect x="0" y="4" width="26" height="22" rx="2"/><path d="M6 10h4M16 10h4M6 16h4M16 16h4M10 26v-6h6v6"/></g><text class="biz-s" x="0" y="54">Business 3</text></g>
      <text class="tagline" id="rightNote" x="980" y="478"></text>

      <g id="particles"></g>
    </svg>
    <div class="prog"><i id="prog"></i></div>
  </div>
  <footer>
    <div class="steps" id="steps"></div>
    <div class="ctrl">
      <button class="btn" id="prev" type="button" aria-label="Previous step">&#8592;</button>
      <button class="btn primary" id="play" type="button" aria-pressed="true">Pause</button>
      <button class="btn" id="next" type="button" aria-label="Next step">&#8594;</button>
      <button class="btn" id="speed" type="button">1&#215;</button>
      <button class="btn" id="restart" type="button">Restart</button>
    </div>
    <span class="small">Space: play / pause &#183; &#8592; &#8594;: step &#183; Names and amounts are illustrative.</span>
  </footer>
</main>

<script>
(function(){
"use strict";
var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
var $ = function(id){ return document.getElementById(id); };
var show = function(id, on){ $(id).classList.toggle('hide', !on); };
var dim = function(id, on){ $(id).classList.toggle('dim', on); };
var lerp = function(a,b,t){ return a+(b-a)*t; };
var ease = function(t){ return 1-Math.pow(1-t,3); };
var fmt = function(n){ return 'SAR ' + Math.round(n).toLocaleString('en-US'); };

/* Six steps. One sentence each. One thing happens at a time. */
var SCENES = [
  {k:'Learn',  t:'Sara learns to build AI agents through Masar’s learning path.', d:5.0},
  {k:'Build',  t:'She builds her first AI agent.', d:3.6},
  {k:'Check',  t:'Masar checks it for accuracy, precision and data privacy.', d:4.6},
  {k:'List',   t:'It goes live on the Masar marketplace.', d:3.2},
  {k:'Use',    t:'Khalid subscribes and uses it in his business. Sara stays the owner.', d:6.0},
  {k:'Grow',   t:'More businesses subscribe. Sara’s revenue grows.', d:5.5},
  {k:'Invest', t:'Investors see the traction and back Sara — so she builds the next agent.', d:5.5}
];
var scene = 0, sceneT = 0, playing = true, speed = 1, money = 0, agentNo = 1;

var stepsEl = $('steps');
stepsEl.innerHTML = SCENES.map(function(s,i){ return '<button class="step" type="button" data-i="'+i+'"><b>0'+(i+1)+'</b>'+s.k+'</button>'; }).join('');
stepsEl.addEventListener('click', function(e){ var b = e.target.closest('[data-i]'); if (b) goTo(+b.dataset.i); });

/* ---- particles along paths ---- */
var PART = $('particles'), flows = {}, particles = [], P = {};
['pLearn','pInv','pList','pUse1','pUse2','pUse3','pPay'].forEach(function(id){ var el = $(id); P[id] = {el:el, len:el.getTotalLength()}; });
function setFlow(name, cfg){ var prev = flows[name]; if (cfg) flows[name] = Object.assign({acc:0}, cfg); else delete flows[name]; var pid = cfg ? cfg.path : (prev && prev.path); if (pid) $(pid).classList.toggle('on', !!cfg); }
function clearFlows(){ Object.keys(flows).forEach(function(k){ $(flows[k].path).classList.remove('on'); }); flows = {}; particles.forEach(function(p){ p.el.remove(); }); particles = []; }
function spawn(cfg){
  var g = document.createElementNS('http://www.w3.org/2000/svg','g');
  var halo = document.createElementNS('http://www.w3.org/2000/svg','circle'); halo.setAttribute('r', cfg.r*2.4); halo.setAttribute('class', cfg.cls+'-g');
  var dot = document.createElementNS('http://www.w3.org/2000/svg','circle'); dot.setAttribute('r', cfg.r); dot.setAttribute('class', cfg.cls);
  g.appendChild(halo); g.appendChild(dot); PART.appendChild(g);
  particles.push({el:g, path:P[cfg.path], t:0, sp:cfg.sp, rev:cfg.reverse});
}
function stepParticles(dt){
  Object.keys(flows).forEach(function(k){ var f = flows[k]; f.acc += dt*f.rate; while (f.acc >= 1){ f.acc -= 1; spawn(f); } });
  for (var i = particles.length-1; i >= 0; i--){
    var p = particles[i]; p.t += dt*p.sp; if (p.t >= 1){ p.el.remove(); particles.splice(i,1); continue; }
    var u = p.rev ? 1-p.t : p.t, pt = p.path.el.getPointAtLength(u*p.path.len);
    p.el.setAttribute('transform', 'translate('+pt.x.toFixed(1)+' '+pt.y.toFixed(1)+')');
    p.el.setAttribute('opacity', p.t < .1 ? p.t/.1 : p.t > .9 ? (1-p.t)/.1 : 1);
  }
}

/* ---- tweens and timers ---- */
var tweens = [], timers = [];
function later(fn, ms){ timers.push(setTimeout(fn, REDUCED ? 0 : ms)); }
function tween(from, to, dur, fn, done){ tweens.push({from:from, to:to, dur:dur, t:0, fn:fn, done:done}); }
function stepTweens(dt){
  for (var i = tweens.length-1; i >= 0; i--){ var tw = tweens[i]; tw.t = Math.min(1, tw.t + dt/tw.dur); var e = ease(tw.t);
    tw.fn(lerp(tw.from[0],tw.to[0],e), lerp(tw.from[1],tw.to[1],e), e); if (tw.t >= 1){ tweens.splice(i,1); if (tw.done) tw.done(); } }
}
function pos(id){ var m = /translate\(([-\d.]+) ([-\d.]+)\)/.exec($(id).getAttribute('transform')); return [+m[1], +m[2]]; }
function put(id, x, y){ $(id).setAttribute('transform', 'translate('+x+' '+y+')'); }
function moveTo(id, x, y, dur, done){ var from = pos(id); tween(from, [x,y], dur, function(a,b){ put(id, a.toFixed(1), b.toFixed(1)); }, done); }
function setRing(p){ $('ringF').setAttribute('stroke-dashoffset', (540.4*(1-p)).toFixed(1)); }
function setChecks(n){ [1,2,3].forEach(function(k){ var on = k <= n; $('chk'+k).querySelectorAll('.chk,.chk-i,.chk-t').forEach(function(el){ el.classList.toggle('on', on); }); }); }
function setLessons(n){ var rows = $('lessons').querySelectorAll('.chk'), txt = $('lessons').querySelectorAll('.chk-t'); rows.forEach(function(r,i){ r.classList.toggle('on', i < n); txt[i].classList.toggle('on', i < n); }); }
function setMoney(v){ money = v; $('moneyV').textContent = fmt(v); }
function setCaption(i){
  $('capK').textContent = 'Step ' + (i+1) + ' of ' + SCENES.length;
  var h = $('capT'); h.classList.add('swap'); setTimeout(function(){ h.textContent = SCENES[i].t; h.classList.remove('swap'); }, REDUCED ? 0 : 200);
  stepsEl.querySelectorAll('.step').forEach(function(b,k){ b.classList.toggle('on', k===i); b.classList.toggle('done', k<i); });
}

/* ---- base state: everything off, then build up to the step ---- */
function resetAll(){
  clearFlows(); tweens = []; timers.forEach(clearTimeout); timers = [];
  ['gMoney','gAgent','gVer','gOwn','gGate','gShelf','gKhalid','gBiz2','gBiz3','gLearn','gInv'].forEach(function(id){ show(id,false); });
  ['gSara','gAgent','gGate','gShelf','gKhalid','gBiz2','gBiz3','gMoney','gOwn','gLearn','gInv'].forEach(function(id){ dim(id,false); });
  ['saraNote','midNote','rightNote','invNote'].forEach(function(id){ $(id).textContent = ''; $(id).setAttribute('class','tagline'); });
  $('ctL').setAttribute('class','col-t'); $('ctM').setAttribute('class','col-t'); $('ctR').setAttribute('class','col-t'); $('ctR').textContent = 'Businesses';
  $('saraRole').textContent = 'Learner'; put('gAgent', 150, 100); setRing(0); setChecks(0); setLessons(0); setMoney(0);
}
function creator(){ $('saraRole').textContent = 'Creator'; }
function enter(i){
  setCaption(i); resetAll();
  /* state that must already be true when a later step starts */
  if (i >= 1){ setRing(1); creator(); }
  if (i >= 2){ show('gAgent', true); put('gAgent', 600, 230); }
  if (i >= 3){ show('gVer', true); setChecks(3); show('gShelf', true); show('gOwn', true); }
  if (i >= 4){ show('gKhalid', true); show('gMoney', true); setMoney(1500); }
  if (i >= 5){ show('gBiz2', true); show('gBiz3', true); setMoney(4500); }

  if (i === 0){
    $('ctL').setAttribute('class','col-t hi'); $('ctM').setAttribute('class','col-t hi');
    show('gLearn', true); $('midNote').textContent = 'Masar teaches her, step by step'; $('midNote').setAttribute('class','tagline mint');
    setFlow('learn', {path:'pLearn', rate:1.6, sp:.7, r:3.6, cls:'mint-p'});
    tween([0,0],[1,0],4.2,function(a){ setRing(a); });
    later(function(){ setLessons(1); $('saraNote').textContent = 'Lesson 1 done'; }, 1200);
    later(function(){ setLessons(2); $('saraNote').textContent = 'Lesson 2 done'; }, 2500);
    later(function(){ setLessons(3); $('saraNote').textContent = 'Ready to build'; $('saraNote').setAttribute('class','tagline mint'); creator(); }, 3900);
  }
  if (i === 1){
    $('ctL').setAttribute('class','col-t hi'); $('saraNote').textContent = agentNo > 1 ? 'Building agent number ' + agentNo : 'Building it for a real business problem';
    put('gAgent', 220, 60); later(function(){ show('gAgent', true); moveTo('gAgent', 380, 250, 1.6); }, 500);
  }
  if (i === 2){
    $('ctM').setAttribute('class','col-t hi'); show('gGate', true); put('gAgent', 380, 250); show('gVer', false);
    later(function(){ moveTo('gAgent', 600, 230, 1.4); }, 300);
    later(function(){ setChecks(1); $('midNote').textContent = 'Checking accuracy'; $('midNote').setAttribute('class','tagline mint'); }, 1900);
    later(function(){ setChecks(2); $('midNote').textContent = 'Checking precision'; }, 2600);
    later(function(){ setChecks(3); $('midNote').textContent = 'Checking data privacy'; }, 3300);
    later(function(){ show('gVer', true); $('midNote').textContent = 'Passed'; }, 4000);
  }
  if (i === 3){
    $('ctM').setAttribute('class','col-t hi'); show('gShelf', false); show('gOwn', false);
    later(function(){ show('gShelf', true); }, 400);
    later(function(){ show('gOwn', true); $('midNote').textContent = 'Businesses can now find it'; $('midNote').setAttribute('class','tagline mint'); }, 1200);
  }
  if (i === 4){
    $('ctR').setAttribute('class','col-t gold'); show('gKhalid', false); show('gMoney', false); setMoney(0);
    later(function(){ show('gKhalid', true); $('rightNote').textContent = 'Subscribes to the agent'; $('rightNote').setAttribute('class','tagline gold'); }, 400);
    later(function(){ setFlow('use', {path:'pUse1', rate:1.6, sp:.7, r:4, cls:'use'}); setFlow('back', {path:'pUse1', rate:1.2, sp:.7, r:3.2, cls:'mint-p', reverse:true}); $('rightNote').textContent = 'Uses it every day in his business'; }, 1500);
    later(function(){ show('gMoney', true); setFlow('pay', {path:'pPay', rate:1.4, sp:.6, r:5, cls:'coin'}); $('saraNote').textContent = 'A monthly fee comes to Sara'; $('saraNote').setAttribute('class','tagline gold');
      tween([0,0],[1,0],2.6,function(a){ setMoney(1500*a); }); }, 3000);
  }
  if (i === 5){
    $('ctR').setAttribute('class','col-t gold'); show('gBiz2', false); show('gBiz3', false); setMoney(1500);
    setFlow('use', {path:'pUse1', rate:1.4, sp:.7, r:4, cls:'use'}); setFlow('pay', {path:'pPay', rate:1.4, sp:.6, r:5, cls:'coin'});
    $('saraNote').textContent = 'Monthly revenue keeps coming'; $('saraNote').setAttribute('class','tagline gold');
    later(function(){ show('gBiz2', true); setFlow('use2', {path:'pUse2', rate:1.2, sp:.65, r:4, cls:'use'}); flows.pay.rate = 2.2; tween([1500,0],[3000,0],1.4,function(a){ setMoney(a); }); }, 800);
    later(function(){ show('gBiz3', true); setFlow('use3', {path:'pUse3', rate:1.2, sp:.65, r:4, cls:'use'}); flows.pay.rate = 3; tween([3000,0],[4500,0],1.4,function(a){ setMoney(a); }); $('rightNote').textContent = 'Three businesses, one agent'; $('rightNote').setAttribute('class','tagline violet'); }, 2400);
  }
  if (i === 6){
    setMoney(4500); show('gInv', false); $('ctR').textContent = 'Businesses & investors'; $('ctR').setAttribute('class','col-t gold');
    setFlow('use', {path:'pUse1', rate:1.2, sp:.7, r:4, cls:'use'}); setFlow('pay', {path:'pPay', rate:2.2, sp:.6, r:5, cls:'coin'});
    ['gKhalid','gBiz2','gBiz3'].forEach(function(id){ dim(id, true); });
    later(function(){ show('gInv', true); $('invNote').textContent = 'Sees real usage and real revenue'; $('invNote').setAttribute('class','tagline gold'); }, 500);
    later(function(){ setFlow('inv', {path:'pInv', rate:5, sp:.5, r:5, cls:'coin'}); $('invNote').textContent = 'Invests in Sara’s agent business'; }, 1800);
    later(function(){ $('saraNote').textContent = 'Backed — starts building agent number ' + (agentNo+1); $('saraNote').setAttribute('class','tagline mint'); $('ctL').setAttribute('class','col-t hi'); }, 3600);
  }
}
function goTo(i){
  if (i >= SCENES.length){ agentNo += 1; i = agentNo > 3 ? 0 : 1; if (i === 0) agentNo = 1; }
  if (i < 0) i = 0;
  scene = i; sceneT = 0; enter(i);
}

/* ---- main loop ---- */
var last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min((now-last)/1000, .05)*speed; last = now;
  if (!playing) return;
  sceneT += dt; stepTweens(dt); stepParticles(dt);
  var d = SCENES[scene].d; $('prog').style.width = (Math.min(1, sceneT/d)*100).toFixed(2)+'%';
  if (sceneT >= d) goTo(scene+1);
}
function setPlaying(v){ playing = v; $('play').textContent = playing ? 'Pause' : 'Play'; $('play').setAttribute('aria-pressed', String(playing)); last = performance.now(); }
$('play').addEventListener('click', function(){ setPlaying(!playing); });
/* embed mode: the host page tells us when we are on screen */
if (/[?&]embed/.test(location.search)){ document.body.classList.add('embed'); setPlaying(false);
  addEventListener('message', function(e){ if (!e.data || typeof e.data.masar !== 'string') return; if (e.data.masar === 'play') setPlaying(true); if (e.data.masar === 'pause') setPlaying(false); if (e.data.masar === 'restart'){ agentNo = 1; goTo(0); } }); }
$('next').addEventListener('click', function(){ goTo(scene+1); });
$('prev').addEventListener('click', function(){ goTo(scene-1); });
$('restart').addEventListener('click', function(){ agentNo = 1; goTo(0); });
$('speed').addEventListener('click', function(){ speed = speed === 1 ? 2 : speed === 2 ? .5 : 1; this.textContent = (speed === .5 ? '0.5' : speed) + '×'; });
addEventListener('keydown', function(e){
  if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
  if (e.key === ' '){ e.preventDefault(); $('play').click(); } else if (e.key === 'ArrowRight') $('next').click(); else if (e.key === 'ArrowLeft') $('prev').click();
});
document.addEventListener('visibilitychange', function(){ last = performance.now(); });
goTo(0); requestAnimationFrame(loop);
window.MasarDiagram = { goTo: goTo, scenes: SCENES, state: function(){ return {scene:scene, sceneT:sceneT, money:money, agentNo:agentNo, flows:Object.keys(flows), particles:particles.length}; } };
})();
</script>
