<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masar — scan to open the prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%}
  body{background:#08090B;color:#F5F5F0;font-family:"Archivo",system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}
  .card{display:flex;flex-direction:column;align-items:center;gap:22px;padding:40px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:#0D1013;text-align:center;max-width:100%}
  h1{margin:0;font-size:2rem;letter-spacing:.2em}
  h1 span{color:#66F6D2}
  p{margin:0;font-family:"JetBrains Mono",monospace;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#858A93}
  .qr{background:#fff;padding:18px;border-radius:14px;line-height:0}
  .qr img{display:block;width:min(360px,80vw);height:auto}
  .url{font-family:"JetBrains Mono",monospace;font-size:.85rem;color:#66F6D2;letter-spacing:0;text-transform:none}
  @media print{body{background:#fff;color:#000}.card{border:0;background:#fff}p,.url{color:#000}h1 span{color:#000}}
</style>
</head>
<body>
  <div class="card">
    <h1>MASAR <span>/</span></h1>
    <p>Scan to open the prototype</p>
    <div class="qr"><img src="qr-masar.png" alt="QR code linking to https://masartechai.github.io/Masar/" width="1000" height="1000"></div>
    <p class="url">masartechai.github.io/Masar</p>
    <p>The AI Agent Ecosystem</p>
  </div>
</body>
</html>
